name: "💡 功能建议 (Feature Request)"
description: 提出新功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能是为了解决什么痛点或场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望怎么实现或表现
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 备选方案
      description: 其他可考虑的思路
    validations:
      required: false
