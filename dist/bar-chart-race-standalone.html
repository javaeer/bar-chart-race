<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Chart Race Studio · 动态排序条形竞赛</title>
<style>
/* ============================================================
   Bar Chart Race Studio —— 控制台样式
   深浅双主题，靠 [data-theme] 切换；所有色值走 CSS 变量。
   ============================================================ */

:root {
  --bg: #0e1117;
  --bg-elev: #161b24;
  --bg-hover: #1d2430;
  --border: #262d3a;
  --text: #e6eaf2;
  --text-dim: #8b95a7;
  --text-faint: #5d6674;
  --accent: #4c8dff;
  --accent-hover: #6ea0ff;
  --danger: #ff5f6d;
  --success: #2ecc8f;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --radius: 10px;
  --panel-w: 320px;
  font-synthesis: none;
}

[data-theme="light"] {
  --bg: #f6f7f9;
  --bg-elev: #ffffff;
  --bg-hover: #eef1f5;
  --border: #e2e6ec;
  --text: #1a1f29;
  --text-dim: #5c6775;
  --text-faint: #8b95a3;
  --shadow: 0 10px 30px rgba(20, 30, 50, .10);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; flex-direction: column; height: 100vh; }

/* ─────────────── 顶栏 ─────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 0 18px; height: 56px; flex: 0 0 56px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}

.brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
.brand svg { color: var(--accent); }
.brand em { font-style: normal; color: var(--text-dim); font-weight: 400; }

.topbar-actions { display: flex; align-items: center; gap: 8px; }

/* ─────────────── 通用控件 ─────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: 8px; cursor: pointer;
  background: var(--bg-hover); color: var(--text);
  border: 1px solid var(--border);
  font-size: 13px; font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .06s;
}
.btn:hover { background: var(--border); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--bg-hover); }

.select {
  height: 34px; padding: 0 10px; border-radius: 8px; cursor: pointer;
  background: var(--bg-hover); color: var(--text);
  border: 1px solid var(--border);
  font-size: 13px; min-width: 0; max-width: 240px;
}
.select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.speed { width: 74px; }

input[type="text"] {
  height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--bg-hover); color: var(--text);
  border: 1px solid var(--border); font-size: 13px; width: 100%;
}
input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 3px;
  background: var(--border); outline: none; margin: 8px 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid var(--bg-elev);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
}
input[type="range"]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid var(--bg-elev);
}

/* ─────────────── 主体布局 ─────────────── */
.body { display: flex; flex: 1; min-height: 0; }

.panel {
  flex: 0 0 var(--panel-w); width: var(--panel-w);
  background: var(--bg-elev); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.panel-scroll { overflow-y: auto; overflow-x: hidden; padding: 4px 0 32px; }
.panel-scroll::-webkit-scrollbar { width: 8px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.group { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.group h3 {
  margin: 0 0 14px; font-size: 11px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-faint);
}

.field { display: block; margin-bottom: 14px; }
.field > span {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px;
}
.field > span b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.field small { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: -2px; line-height: 1.5; }
.field.range > span { margin-bottom: 2px; }

.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.check { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12.5px; color: var(--text-dim); }
.check input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
.check:hover { color: var(--text); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.export-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.export-row .btn { flex: 1 1 auto; }

.hint { font-size: 11.5px; color: var(--text-faint); line-height: 1.6; margin: 12px 0 0; }
.hint code {
  background: var(--bg-hover); padding: 1px 5px; border-radius: 4px;
  font-size: 11px; border: 1px solid var(--border);
}

.progress {
  margin-top: 12px; height: 22px; border-radius: 6px; overflow: hidden;
  background: var(--bg-hover); position: relative; border: 1px solid var(--border);
}
.progress-bar {
  height: 100%; width: 0%; border-radius: 5px 0 0 5px;
  background: linear-gradient(90deg, var(--accent), var(--accent-hover));
  transition: width .12s linear;
}
.progress span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 11px; font-weight: 600; color: var(--text);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
}
.hidden { display: none !important; }

/* ─────────────── 舞台 ─────────────── */
.stage {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  padding: 20px 22px 14px; gap: 14px; position: relative;
}

.canvas-wrap {
  flex: 1; min-height: 0;
  display: grid; place-items: center; position: relative;
  border-radius: var(--radius);
  background:
    repeating-conic-gradient(from 45deg, transparent 0% 25%, rgba(120, 130, 150, .045) 0% 50%) 50% / 18px 18px;
  padding: 10px;
}
.canvas-wrap.dragover { outline: 2px dashed var(--accent); outline-offset: -6px; }

#chart {
  display: block;
  width: 100% !important;
  height: auto !important;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: var(--shadow);
}

.drop-hint {
  position: absolute; inset: 0; display: none; place-items: center;
  background: rgba(76, 141, 255, .12); border-radius: var(--radius);
  font-weight: 600; color: var(--accent); pointer-events: none;
}
.canvas-wrap.dragover .drop-hint { display: grid; }

/* ─────────────── 播放控制条 ─────────────── */
.controls {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 14px;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
}

.ctrl-btn {
  width: 36px; height: 36px; flex: 0 0 36px;
  display: grid; place-items: center; cursor: pointer;
  background: transparent; color: var(--text-dim);
  border: 1px solid transparent; border-radius: 8px; font-size: 14px;
  transition: background .15s, color .15s;
}
.ctrl-btn:hover { background: var(--bg-hover); color: var(--text); }
.ctrl-btn.active { color: var(--accent); }
.ctrl-btn.play { background: var(--accent); color: #fff; }
.ctrl-btn.play:hover { background: var(--accent-hover); color: #fff; }
.ctrl-btn.play .i-pause { display: none; }
.ctrl-btn.play.playing .i-play { display: none; }
.ctrl-btn.play.playing .i-pause { display: block; }

.timeline { flex: 1; min-width: 60px; height: 36px; display: flex; align-items: center; cursor: pointer; }
.timeline-track {
  width: 100%; height: 5px; border-radius: 3px;
  background: var(--border); position: relative; overflow: hidden;
}
.timeline-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
  background: var(--accent); border-radius: 3px;
}
.timeline-track::after {
  content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 2px;
  background: transparent;
}

.time {
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px;
  color: var(--text-dim); min-width: 58px; text-align: center;
}

/* ─────────────── Toast ─────────────── */
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 14px);
  padding: 11px 20px; border-radius: 10px;
  background: var(--bg-elev); color: var(--text);
  border: 1px solid var(--border); box-shadow: var(--shadow);
  font-size: 13px; font-weight: 500; z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
  max-width: min(560px, 88vw); line-height: 1.5;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { border-color: var(--danger); color: var(--danger); }
.toast.success { border-color: var(--success); }

/* ─────────────── 响应式 ─────────────── */
.only-mobile { display: none; }

@media (max-width: 900px) {
  .only-mobile { display: inline-flex; }
  .panel {
    position: absolute; inset: 56px 0 0 0; width: 100%;
    flex-basis: auto; z-index: 30; transform: translateX(-100%);
    transition: transform .25s ease;
  }
  .panel.open { transform: none; }
  .stage { padding: 12px 12px 10px; }
  .controls { gap: 6px; padding: 0 8px; }
  .time { min-width: 46px; font-size: 12px; }
}

</style>
</head>
<body>

<div class="app">

  <!-- ───────────────────────── 顶栏 ───────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <rect x="2" y="4" width="14" height="3.4" rx="1.4" fill="currentColor"/>
        <rect x="2" y="10" width="9" height="3.4" rx="1.4" fill="currentColor" opacity=".72"/>
        <rect x="2" y="16" width="19" height="3.4" rx="1.4" fill="currentColor" opacity=".44"/>
      </svg>
      <span>Bar Chart Race <em>Studio</em></span>
    </div>

    <div class="topbar-actions">
      <select id="dataset" class="select" title="选择内置数据集"></select>
      <label class="btn btn-ghost" title="上传自己的 CSV">
        上传数据
        <input type="file" id="file" accept=".csv,.txt,.tsv" hidden>
      </label>
      <select id="templateSel" class="select" title="下载 CSV 模板，照着格式填数据">
        <option value="">📄 模板下载</option>
        <option value="long">长表模板 · 城市人口</option>
        <option value="wide">宽表模板 · 省份年度数据</option>
        <option value="icon">带图标模板 · icon 列</option>
      </select>
      <button id="themeToggle" class="btn btn-ghost" title="切换明暗主题">🌗</button>
      <button id="panelToggle" class="btn btn-ghost only-mobile" title="参数面板">⚙</button>
    </div>
  </header>

  <!-- ───────────────────────── 主体 ───────────────────────── -->
  <main class="body">

    <!-- 参数面板 -->
    <aside class="panel" id="panel">
      <div class="panel-scroll">

        <section class="group">
          <h3>文案</h3>
          <label class="field">
            <span>标题</span>
            <input type="text" id="title" value="全球最具价值品牌" placeholder="留空则隐藏">
          </label>
          <label class="field">
            <span>副标题</span>
            <input type="text" id="subtitle" value="按品牌价值排名 · 单位：百万美元" placeholder="留空则隐藏">
          </label>
          <label class="field">
            <span>脚注</span>
            <input type="text" id="footer" value="数据来源：Interbrand" placeholder="留空则隐藏">
          </label>
        </section>

        <section class="group">
          <h3>竞赛参数</h3>
          <label class="field range">
            <span>显示条目 <b id="nVal">12</b></span>
            <input type="range" id="n" min="3" max="30" step="1" value="12">
          </label>
          <label class="field range">
            <span>插值密度 <b id="kVal">10</b></span>
            <input type="range" id="k" min="1" max="20" step="1" value="10">
            <small>相邻两个观测点之间插入多少过渡帧，越大越顺滑</small>
          </label>
          <label class="field range">
            <span>每帧时长 <b id="frameVal">250</b> ms</span>
            <input type="range" id="frameDur" min="40" max="900" step="10" value="250">
            <small>决定整段动画的播放速度</small>
          </label>
          <label class="field">
            <span>排序方式</span>
            <select id="sortDir" class="select">
              <option value="desc">从大到小</option>
              <option value="asc">从小到大</option>
            </select>
          </label>
          <label class="field">
            <span>位置缓动</span>
            <select id="easing" class="select">
              <option value="linear">线性（同 D3 原版）</option>
              <option value="smooth">平滑（有吸附感）</option>
              <option value="smoother">更强平滑</option>
            </select>
          </label>
        </section>

        <section class="group">
          <h3>外观</h3>
          <label class="field">
            <span>画布底色</span>
            <select id="canvasTheme" class="select">
              <option value="tech">科技深蓝（默认）</option>
              <option value="cyber">赛博霓虹</option>
              <option value="dark">深色（视频推荐）</option>
              <option value="light">浅色</option>
              <option value="gradient">深色渐变</option>
              <option value="paper">米白纸感</option>
            </select>
          </label>
          <label class="field">
            <span>标签布局</span>
            <select id="labelLayout" class="select">
              <option value="inline">自适应（默认）</option>
              <option value="left">名称固定在左侧</option>
              <option value="trail">名称跟随条形末端</option>
            </select>
          </label>
          <label class="field">
            <span>配色方案</span>
            <select id="palette" class="select"></select>
          </label>
          <label class="field">
            <span>上色依据</span>
            <select id="colorMode" class="select">
              <option value="category">按分类</option>
              <option value="name">按名称</option>
              <option value="rank">按名次</option>
              <option value="solid">单一颜色</option>
            </select>
          </label>
          <label class="field">
            <span>数值格式</span>
            <select id="valueFormat" class="select">
              <option value="full">千分位 123,456</option>
              <option value="si">英文缩写 12.3M</option>
              <option value="cn">中文单位 1.23亿</option>
              <option value="raw">原始数值</option>
            </select>
          </label>
          <label class="field range">
            <span>条形圆角 <b id="radiusVal">0.28</b></span>
            <input type="range" id="barRadius" min="0" max="0.5" step="0.02" value="0.28">
          </label>
          <label class="field range">
            <span>立体感（伪 3D 厚度）<b id="depthVal">0.45</b></span>
            <input type="range" id="depth3D" min="0" max="1" step="0.05" value="0.45">
          </label>
          <div class="checks">
            <label class="check"><input type="checkbox" id="showValue" checked><span>显示数值</span></label>
            <label class="check"><input type="checkbox" id="showAxis" checked><span>显示坐标轴</span></label>
            <label class="check"><input type="checkbox" id="showGrid" checked><span>显示网格线</span></label>
            <label class="check"><input type="checkbox" id="showTicker" checked><span>显示日期角标</span></label>
            <label class="check"><input type="checkbox" id="fadeEdge" checked><span>边缘淡出</span></label>
          </div>
        </section>

        <section class="group">
          <h3>柱头徽标</h3>
          <label class="field">
            <span>显示徽标</span>
            <select id="iconPosition" class="select">
              <option value="front">骑在柱头（跟随柱顶）</option>
              <option value="inside">柱头内侧</option>
              <option value="start">条形起点外侧</option>
              <option value="none">不显示</option>
            </select>
          </label>
          <label class="field range">
            <span>徽标大小 <b id="iconSizeVal">0.90</b></span>
            <input type="range" id="iconSize" min="0.5" max="1.6" step="0.05" value="0.9">
          </label>
          <p class="hint">
            徽标来源优先级：CSV 里的 <code>icon</code>/<code>image</code> 列 → 按分类/国家自动匹配
            → 名称关键词 → 首字圆牌。系统缺少 emoji 字体时自动降级为圆牌，不会出现方块。
          </p>
        </section>

        <section class="group">
          <h3>画布</h3>
          <label class="field">
            <span>分辨率</span>
            <select id="preset" class="select">
              <option value="1280x720">1280 × 720（16:9 横版）</option>
              <option value="1920x1080" selected>1920 × 1080（16:9 高清）</option>
              <option value="2560x1440">2560 × 1440（2K）</option>
              <option value="1080x1080">1080 × 1080（正方形）</option>
              <option value="1080x1920">1080 × 1920（9:16 竖版）</option>
            </select>
          </label>
          <label class="field">
            <span>渲染倍率 <b id="dprVal">1</b>×</span>
            <input type="range" id="dpr" min="1" max="3" step="1" value="1">
            <small>提高倍率可得到更锐利的导出画质</small>
          </label>
        </section>

        <section class="group">
          <h3>导出</h3>
          <div class="grid2">
            <label class="field">
              <span>帧率</span>
              <select id="fps" class="select">
                <option value="24">24 fps</option>
                <option value="30" selected>30 fps</option>
                <option value="60">60 fps</option>
              </select>
            </label>
            <label class="field">
              <span>码率 Mbps</span>
              <select id="bitrate" class="select">
                <option value="4000000">4</option>
                <option value="8000000">8</option>
                <option value="12000000" selected>12</option>
                <option value="24000000">24</option>
              </select>
            </label>
          </div>
          <div class="export-row">
            <button id="exportVideo" class="btn btn-primary">⏺ 录制视频</button>
            <button id="exportFrames" class="btn">🗂 帧序列 ZIP</button>
            <button id="exportPNG" class="btn">🖼 当前帧 PNG</button>
          </div>
          <div id="progressWrap" class="progress hidden">
            <div id="progressBar" class="progress-bar"></div>
            <span id="progressText">准备中…</span>
          </div>
          <p class="hint">
            导出时长 = 关键帧数 × 每帧时长，当前约 <b id="durHint">—</b>。<br>
            需要 MP4 / GIF 可用配套的 <code>npm run postprocess</code> 转码。
          </p>
        </section>

      </div>
    </aside>

    <!-- 舞台 -->
    <section class="stage" id="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="chart"></canvas>
        <div id="dropHint" class="drop-hint">松手即可载入 CSV 数据</div>
      </div>

      <!-- 播放控制条 -->
      <div class="controls">
        <button id="playBtn" class="ctrl-btn play" title="播放 / 暂停 (空格)">
          <svg class="i-play" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" width="20" height="20"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button id="prevBtn" class="ctrl-btn" title="上一帧 (←)">⏮</button>
        <button id="nextBtn" class="ctrl-btn" title="下一帧 (→)">⏭</button>
        <button id="loopBtn" class="ctrl-btn active" title="循环播放">⟲</button>

        <div class="timeline" id="timeline">
          <div class="timeline-track"><div class="timeline-fill" id="tlFill"></div></div>
        </div>

        <span class="time" id="curTime">2000</span>
        <select id="speed" class="select speed" title="播放速度">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>
    </section>

  </main>

  <div id="toast" class="toast"></div>
</div>

<script>
/* 单文件版：由 scripts/build-standalone.js 生成，所有模块内联，无需本地服务器 */

"use strict";
/* ─── src/core/math.js ─────────────────────────────── */
/**
 * 数学与缓动工具
 * ------------------------------------------------------------------
 * Bar Chart Race 的所有动画都归结为「在两个状态之间按某个比例插值」。
 * 这里集中定义插值原语与时间曲线（easing），渲染层与播放层共用。
 */

/** 线性插值 */
function lerp(a, b, t) {
  return a * (1 - t) + b * t;
}

/** 反向插值：求 v 在 [a,b] 中的位置 */
function invLerp(a, b, v) {
  return a === b ? 0 : (v - a) / (b - a);
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/** 把 v 从 [d0,d1] 线性映射到 [r0,r1] */
function rescale(v, d0, d1, r0, r1) {
  return d0 === d1 ? r0 : r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);
}

/** 「漂亮的」刻度步长：1 / 2 / 5 × 10^n */
function tickStep(min, max, count) {
  const span = max - min;
  if (!(span > 0) || !(count > 0)) return 1;
  const rough = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const mult = norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1;
  return mult * mag;
}

/**
 * 生成刻度序列（从 0 起）。
 * 用于动态坐标轴：轴上永远显示当前第一名的量级下的整齐刻度。
 */
function ticks(maxValue, count) {
  if (!(maxValue > 0)) return [0];
  const step = tickStep(0, maxValue, count);
  const out = [];
  // 从 step 开始，跳过 0（0 处是条形起点，标 0 意义不大且会与其他元素打架）
  for (let v = step; v <= maxValue + step * 1e-9; v += step) {
    // 消除浮点累积误差
    out.push(Math.round(v / step) * step);
  }
  return out;
}

/** 缓动函数集 */
const ease = {
  linear: (t) => t,
  quadIn: (t) => t * t,
  quadOut: (t) => t * (2 - t),
  quadInOut: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  cubicIn: (t) => t * t * t,
  cubicOut: (t) => --t * t * t + 1,
  cubicInOut: (t) =>
    t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1,
  expoOut: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
};

/**
 * 可变的分数/小数位数格式化。
 * 「Currently no.1」这类标签需要在祖先值不断变化时保持稳定观感，
 * 所以统一走同一个 numbers formatter。
 */
function padFraction(value, digits) {
  const n = Math.pow(10, digits);
  return Math.round(value * n) / n;
}

/**
 * 数值与日期格式化
 * ------------------------------------------------------------------
 * 对标 d3-format / d3-time-format 的常用子集，零依赖实现。
 */

const DEFAULT_LOCALE = {
  thousands: ",",
  decimal: ".",
  groupSize: 3,
};

/**
 * 千分位分组：把整数部分每 3 位插分隔符。
 * 注意要处理负数与已经带小数的情况。
 */
function groupInt(intStr, loc) {
  const neg = intStr.startsWith("-");
  let s = neg ? intStr.slice(1) : intStr;
  if (s.length <= loc.groupSize) return intStr;
  let out = "";
  for (let i = s.length; i > 0; i -= loc.groupSize) {
    const chunk = s.slice(Math.max(0, i - loc.groupSize), i);
    out = out ? chunk + loc.thousands + out : chunk;
  }
  return (neg ? "-" : "") + out;
}

/**
 * 灵活数值格式化
 * @param {number} value
 * @param {object} [opt]
 * @param {string} [opt.spec]  简短格式串，如 ",d" ".1f" ",.2f" "%"
 * @param {number} [opt.digits] 小数位数（spec 未给时用）
 */
function formatNumber(value, opt = {}) {
  if (value == null || Number.isNaN(value)) return "";
  const loc = { ...DEFAULT_LOCALE, ...opt };
  let grouping = false;
  let digits = opt.digits ?? null;
  let type = "d";

  if (opt.spec) {
    const m = /^([,])?(?:\.(\d+))?([defgs%])$/.exec(opt.spec.trim());
    if (m) {
      grouping = m[1] === ",";
      if (m[2] != null) digits = parseInt(m[2], 10);
      type = m[3];
    }
  }

  if (type === "s") return siFormat(value, digits ?? 3);
  if (type === "%") {
    const s = (value * 100).toFixed(digits ?? 1);
    return maybeGroup(s, grouping, loc) + "%";
  }

  const fixed = digits == null ? null : Number(value).toFixed(digits);
  if (fixed != null) return maybeGroup(fixed, grouping, loc);

  // 非 '.' 指定的整数模式：四舍五入到整数
  return maybeGroup(String(Math.round(Number(value))), grouping, loc);
}

function maybeGroup(numStr, grouping, loc) {
  if (!grouping) return numStr;
  const neg = numStr.startsWith("-");
  let s = neg ? numStr.slice(1) : numStr;
  const dot = s.indexOf(".");
  const intPart = dot >= 0 ? s.slice(0, dot) : s;
  const fracPart = dot >= 0 ? s.slice(dot) : "";
  return (neg ? "-" : "") + groupInt(intPart, loc) + fracPart;
}

const SI_UNITS = [
  { v: 1e12, s: "T" },
  { v: 1e9, s: "B" },
  { v: 1e6, s: "M" },
  { v: 1e3, s: "k" },
];
const SI_UNITS_CN = [
  { v: 1e12, s: "万亿" },
  { v: 1e8, s: "亿" },
  { v: 1e4, s: "万" },
];

/** SI 缩写：1,234,567 → 1.23M */
function siFormat(value, digits = 3) {
  const abs = Math.abs(value);
  for (const u of SI_UNITS) {
    if (abs >= u.v) {
      const n = value / u.v;
      const str = trimZeros(n.toFixed(digitsDecimal(n, digits)));
      return str + u.s;
    }
  }
  return trimZeros(value.toFixed(digitsDecimal(value, digits)));
}

/** 中文数量单位：123456789 → 1.23亿 */
function cnNumber(value, digits = 2) {
  const abs = Math.abs(value);
  const sign = value < 0 ? "-" : "";
  for (const u of SI_UNITS_CN) {
    if (abs >= u.v) {
      const n = abs / u.v;
      return sign + trimZeros(n.toFixed(digitsDecimal(n, digits))) + u.s;
    }
  }
  return sign + String(Math.round(abs));
}

function digitsDecimal(n, digits) {
  const abs = Math.abs(n);
  if (abs >= 100) return Math.max(0, digits - 3);
  if (abs >= 10) return Math.max(0, digits - 2);
  return Math.max(0, digits - 1);
}

function trimZeros(s) {
  return s.indexOf(".") >= 0 ? s.replace(/0+$/, "").replace(/\.$/, "") : s;
}

/**
 * 日期格式化
 * 支持的占位符：%Y %y %m %d %b %B %j(季度) %H %M %S
 * UTC 语义（与 d3.utcFormat 一致），避免时区导致年份偏移。
 */
function utcFormat(spec) {
  const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  // 预编译：拆成 token 序列，避免每帧重复解析
  const parts = [];
  let last = 0;
  for (let i = 0; i < spec.length - 1; i++) {
    if (spec[i] === "%") {
      if (i > last) parts.push({ lit: spec.slice(last, i) });
      const ch = spec[i + 1];
      parts.push({ tok: ch });
      i++;
      last = i + 1;
    }
  }
  if (last < spec.length) parts.push({ lit: spec.slice(last) });

  return (date) => {
    if (!(date instanceof Date)) date = new Date(date);
    const y = date.getUTCFullYear();
    const mo = date.getUTCMonth();
    const d = date.getUTCDate();
    let out = "";
    for (const p of parts) {
      if (p.lit != null) { out += p.lit; continue; }
      switch (p.tok) {
        case "Y": out += String(y).padStart(4, "0"); break;
        case "y": out += String(y % 100).padStart(2, "0"); break;
        case "m": out += String(mo + 1).padStart(2, "0"); break;
        case "d": out += String(d).padStart(2, "0"); break;
        case "b": out += MONTHS_SHORT[mo]; break;
        case "B": out += MONTHS_LONG[mo]; break;
        case "j": out += "Q" + (Math.floor(mo / 3) + 1); break;
        case "H": out += String(date.getUTCHours()).padStart(2, "0"); break;
        case "M": out += String(date.getUTCMinutes()).padStart(2, "0"); break;
        case "S": out += String(date.getUTCSeconds()).padStart(2, "0"); break;
        case "%": out += "%"; break;
        default: out += p.tok;
      }
    }
    return out;
  };
}

/** 中文日期：2023年12月 */
function cnDate(date) {
  const d = date instanceof Date ? date : new Date(date);
  return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月`;
}
function cnYear(date) {
  const d = date instanceof Date ? date : new Date(date);
  return `${d.getUTCFullYear()}年`;
}

/**
 * CSV 解析与数据整形
 * ------------------------------------------------------------------
 * Bar Chart Race 的输入只有两种形态：
 *
 *   A) 长表（long / tidy）—— 每行一条观测：
 *        date,name,category,value
 *        2000-01-01,Coca-Cola,Beverages,72537
 *        2000-01-01,Microsoft,Technology,70196
 *
 *   B) 宽表（wide / matrix）—— 每行一个参赛者，每列一个时间点：
 *        name,1990,1991,1992
 *        广东,1559,1780,2293
 *
 * Flourish 的界面就是要求用户上传宽表。这里两种都吃，自动识别。
 */

/** RFC4180 CSV 解析：支持引号包裹、"" 转义、字段内逗号与换行 */
function parseCSV(text) {
  text = text.replace(/^﻿/, ""); // BOM
  const rows = [];
  let row = [];
  let field = "";
  let i = 0;
  let inQuotes = false;
  const n = text.length;

  while (i < n) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ",") { row.push(field); field = ""; i++; continue; }
    if (c === "\r") { i++; continue; }
    if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }

  if (!rows.length) return { header: [], rows: [] };
  const header = rows[0].map((h) => h.trim());
  const body = rows.slice(1).filter((r) => !(r.length === 1 && r[0].trim() === ""));
  return { header, rows: body };
}

const NUM_RE = /^[-+]?(\d+(\.\d*)?|\.\d+)([eE][-+]?\d+)?$/;
const DATE_RE = /^\d{4}-\d{1,2}(-\d{1,2})?([T ]?\d{1,2}:\d{2}(:\d{2})?)?/;

function autoTypeCell(s) {
  if (s == null) return s;
  const t = s.trim();
  if (t === "" || t === "-" || t === "NA" || t === "null" || t === "NaN") return null;
  if (NUM_RE.test(t)) {
    const n = parseFloat(t);
    if (Number.isFinite(n)) return n;
  }
  if (DATE_RE.test(t)) {
    const d = parseFlexibleDate(t);
    if (d && Number.isFinite(d.getTime())) return d;
  }
  return s;
}

/** 把多种常见写法统一成 UTC 零点日期，避免时区抖动 */
function parseFlexibleDate(input) {
  if (input instanceof Date) return toUTC(input);
  if (typeof input === "number") {
    // 纯年份
    if (Number.isInteger(input) && input >= 1000 && input <= 3000) {
      return new Date(Date.UTC(input, 0, 1));
    }
    return new Date(Date.UTC(1970, 0, 1) + input * 86400000);
  }
  let s = String(input).trim();

  // 2023Q1 / 2023-Q1 / 2023年 / 2023H1
  const m = /^(\d{4})[-\s]?([QqHh])(\d)$/.exec(s);
  if (m) {
    const y = +m[1];
    const step = m[2].toLowerCase() === "q" ? 3 : 6;
    return new Date(Date.UTC(y, (m[3] - 1) * step, 1));
  }
  const cy = /^(\d{4})年(\d{1,2})?月?(\d{1,2})?日?$/.exec(s);
  if (cy) {
    return new Date(Date.UTC(+cy[1], cy[2] ? +cy[2] - 1 : 0, cy[3] ? +cy[3] : 1));
  }
  const ymd = /^(\d{4})[-\/.](\d{1,2})([-\/.](\d{1,2}))?/.exec(s);
  if (ymd) {
    return new Date(Date.UTC(+ymd[1], +ymd[2] - 1, ymd[4] ? +ymd[4] : 1));
  }
  // 纯年份：2023
  if (/^\d{4}$/.test(s)) return new Date(Date.UTC(+s, 0, 1));
  const d = new Date(s);
  if (!Number.isNaN(d.getTime())) return toUTC(d);
  return null;
}

function toUTC(d) {
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
}

/** 列名归一化：处理 date/DATE/ 日期 等各种写法 */
const ALIASES = {
  date: ["date", "time", "year", "日期", "时间", "年份", "period", "month"],
  name: ["name", "label", "category_name", "名称", "名字", "参赛者", "entity", "item", "key", "地区", "省份"],
  value: ["value", "val", "v", "amount", "gdp", "数值", "值", "数量", "金额"],
  category: ["category", "group", "type", "sector", "region", "分类", "类别", "分组", "国家"],
  image: ["image", "img", "icon", "flag", "url", "图片", "图标", "链接"],
  code: ["code", "iso", "id", "编码", "代码"],
};

function normalizeKey(h) {
  return String(h).trim().toLowerCase().replace(/\s+/g, "_");
}

function findColumn(header, keys) {
  const normd = header.map((h) => normalizeKey(h));
  for (const k of keys) {
    const idx = normd.indexOf(k);
    if (idx >= 0) return header[idx];
  }
  return null;
}

/**
 * 把任意 CSV 文本转成标准记录数组：
 *   [{ date: Date, name: string, value: number, category?: string, image?: string }]
 *
 * @param {string} text
 * @param {object} [opt] 手动指定列名：{date,name,value,category,image}
 */
function normalizeData(text, opt = {}) {
  const { header, rows } = parseCSV(text);
  if (!header.length) throw new Error("CSV 为空或格式无法识别");

  let dateCol = opt.date || findColumn(header, ALIASES.date);
  let nameCol = opt.name || findColumn(header, ALIASES.name);
  let valueCol = opt.value || findColumn(header, ALIASES.value);
  const categoryCol = opt.category || findColumn(header, ALIASES.category);
  const imageCol = opt.image || findColumn(header, ALIASES.image);

  const records = [];
  let isWide = false;

  if (dateCol && nameCol && valueCol) {
    // —— 长表 ——
    for (const row of rows) {
      const o = {};
      header.forEach((h, i) => (o[h] = row[i]));
      const date = coerceDate(o[dateCol]);
      const name = o[nameCol];
      let value = o[valueCol];
      if (typeof value === "string") value = parseFloat(String(value).replace(/[,\s]/g, ""));
      if (date == null || name == null || value == null || !Number.isFinite(value)) continue;
      records.push({
        date,
        name: String(name).trim(),
        value,
        category: categoryCol ? o[categoryCol] : undefined,
        image: imageCol ? o[imageCol] : undefined,
      });
    }
  } else {
    // —— 宽表：第一列是名称，其余列是时间点 ——
    isWide = true;
    const key = opt.name ? nameCol : header[0];
    const timeCols = header.slice(1).filter((h) => h !== key);
    for (const row of rows) {
      const o = {};
      header.forEach((h, i) => (o[h] = row[i]));
      const name = o[key];
      if (name == null || String(name).trim() === "") continue;
      for (const c of timeCols) {
        const raw = o[c];
        const value = typeof raw === "number" ? raw : parseFloat(String(raw ?? "").replace(/[,\s%]/g, ""));
        if (!Number.isFinite(value)) continue;
        const date = coerceDate(c);
        if (!date) continue;
        records.push({
          date,
          name: String(name).trim(),
          value,
          category: categoryCol ? o[categoryCol] : undefined,
          image: imageCol ? o[imageCol] : undefined,
        });
      }
    }
  }

  if (!records.length) throw new Error("未解析到有效数据行，请检查列名或数据格式");
  return { records, header, isWide, columns: { dateCol, nameCol, valueCol, categoryCol, imageCol } };
}

function coerceDate(v) {
  if (v == null) return null;
  if (v instanceof Date) return toUTC(v);
  if (typeof v === "number") return parseFlexibleDate(v);
  const s = String(v).trim();
  const num = parseFloat(s.replace(/,/g, ""));
  // 纯数字列（如 2000）在时间列里应作年份处理
  if (NUM_RE.test(s) && Number.isFinite(num)) {
    const maybe = parseFlexibleDate(num);
    if (maybe) return maybe;
  }
  return parseFlexibleDate(s);
}

/** 导出为标准长表 CSV，方便用户二次加工 */
function toCSV(records) {
  const head = ["date", "name", "category", "value"];
  const lines = [head.join(",")];
  for (const r of records) {
    const d = r.date instanceof Date ? r.date.toISOString().slice(0, 10) : r.date;
    lines.push([d, q(r.name), q(r.category), r.value].join(","));
  }
  return lines.join("\n");
}

function q(s) {
  if (s == null || s === "") return "";
  const str = String(s);
  return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

/** Determinstic string → 稳定整数哈希（用于名字分色，避免依赖 Map 顺序） */
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0);
}

class ColorScale {
  /**
   * @param {object} [opt]
   * @param {string} [opt.palette] 色板名
   * @param {string[]} [opt.colors] 自定义色板（优先）
   * @param {"category"|"name"|"rank"|"solid"} [opt.mode]
   * @param {string} [opt.solid] mode=solid 时的颜色
   */
  constructor(opt = {}) {
    this.colors = opt.colors || PALETTES[opt.palette] || PALETTES.tableau10;
    this.mode = opt.mode || "category";
    this.solid = opt.solid || this.colors[0];
    this._map = new Map();
    this._next = 0;
  }

  /** 为某个 key 分配稳定颜色 */
  assign(key) {
    if (this.mode === "solid") return this.solid;
    if (key == null || key === "") key = "__default__";
    let c = this._map.get(key);
    if (c) return c;
    if (this.mode === "category") {
      c = this.colors[this._next++ % this.colors.length];
    } else {
      c = this.colors[hashString(String(key)) % this.colors.length];
    }
    this._map.set(key, c);
    return c;
  }

  /**
   * 按给定顺序预热配色表。
   * 若不预热，颜色会按「首次绘制的顺序」分配 —— 而绘制是从榜尾往榜首画的，
   * 结果榜首品牌反而拿到色板的最后一个颜色。预热保证数据里最先出现的
   * 分类/名字拿走色板开头的颜色，语义上更符合直觉。
   */
  warmup(keys) {
    for (const k of keys) this.assign(k);
    return this;
  }

  reset() { this._map.clear(); this._next = 0; }

  colorOf(entry, rank = 0) {
    if (this.mode === "rank") return this.colors[rank % this.colors.length];
    const key = this.mode === "name" ? entry.name : entry.category;
    if (this.mode === "category" && !entry.category) return this.colors[hashString(entry.name) % this.colors.length];
    return this.assign(key);
  }
}

/** hex → [r,g,b] */
function hexToRgb(hex) {
  let h = String(hex).replace("#", "");
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  const num = parseInt(h, 16);
  if (!Number.isFinite(num)) return [128, 128, 128];
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

/** [r,g,b] → hex */
function rgbToHex(r, g, b) {
  const c = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
  return `#${c(r)}${c(g)}${c(b)}`;
}

/** hex → rgba(...) */
function hexToRgba(hex, alpha = 1) {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

/**
 * 明暗调整（3D 立体感用）：amount > 0 向白混合，< 0 向黑混合，取值 -1..1。
 * 直接混白/黑比转 HSL 更快，且在饱和色上不会跑偏成另一种颜色。
 */
function shade(hex, amount) {
  const [r, g, b] = hexToRgb(hex);
  const target = amount >= 0 ? 255 : 0;
  const p = Math.abs(amount);
  return rgbToHex(r + (target - r) * p, g + (target - g) * p, b + (target - b) * p);
}

/** 判断颜色的感知亮度，用于决定叠加文字用深色还是浅色 */
function luminance(hex) {
  let h = String(hex).replace("#", "");
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  const num = parseInt(h, 16);
  if (!Number.isFinite(num)) return 0.5;
  const r = ((num >> 16) & 255) / 255;
  const g = ((num >> 8) & 255) / 255;
  const b = (num & 255) / 255;
  const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}

/** 选择在给定背景色上可读性更好的文字色 */
function contrastText(bg, dark = "#111827", light = "#ffffff") {
  return luminance(bg) > 0.45 ? dark : light;
}

/**
 * 求一个条目的图标。
 * @returns {{kind:"emoji"|"text", value:string}}
 *          kind=text 时 value 是"首字"，由渲染器画成圆牌
 */
function iconFor(name, category, explicit) {
  // 1) 数据里显式给了 icon / image 列（emoji 或图片 URL 都行）
  if (explicit != null && String(explicit).trim() !== "") {
    const v = String(explicit).trim();
    return /^https?:|^\.{0,2}\//.test(v)
      ? { kind: "url", value: v }
      : { kind: "emoji", value: takeGrapheme(v) };
  }

  // 2) 分类表（行业 / 国家）
  const cat = norm(category);
  if (cat) {
    if (CATEGORY_ICONS[cat]) return { kind: "emoji", value: CATEGORY_ICONS[cat] };
    if (COUNTRY_FLAGS[cat]) return { kind: "emoji", value: COUNTRY_FLAGS[cat] };
  }

  // 3) 名字关键词
  const nm = norm(name);
  for (const [re, emoji] of NAME_HINTS) if (re.test(nm)) return { kind: "emoji", value: emoji };

  // 4) 兜底：首字圆牌
  return { kind: "text", value: initial(name) };
}

/** 取首字：中文取第一个汉字，英文取首字母 */
function initial(name) {
  const s = String(name ?? "").trim();
  if (!s) return "?";
  const ch = s[0];
  if (/[\u4e00-\u9fa5]/.test(ch)) return ch;
  const m = s.match(/[A-Za-z0-9]/);
  return (m ? m[0] : ch).toUpperCase();
}

/** 只取第一个"字形簇"，避免 emoji 带修饰后缀被截断成半个 */
function takeGrapheme(s) {
  const m = String(s).match(/\p{Extended_Pictographic}(?:\uFE0F)?(?:\p{Emoji_Modifier})?/u);
  if (m) return m[0];
  return Array.from(String(s))[0] ?? "";
}

let _emojiOk = null;

/**
 * 探测系统是否真的能画出 emoji。
 * 用"emoji 宽度 vs 未分配码位(tofu)宽度"比较：
 * 没有 emoji 字体时两者都是豆腐块，宽度相同。
 */
/**
 * emoji 彩色渲染探测。
 * 只对比宽度不可靠：装了 NotoSansSymbols2 之类黑白符号字体的 Linux，
 * 部分 emoji 码点宽度与 tofu 不同，画出来却是方块。
 * 所以这里直接离屏画一个纯色 emoji，检查有没有"彩色像素" ——
 * 黑白字形不管多正常都不算支持，宁可降级成首字圆牌，也不出豆腐块。
 */
function detectEmojiSupport() {
  if (_emojiOk != null) return _emojiOk;
  try {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 24;
    const c = tile.getContext("2d");
    if (!c) { _emojiOk = false; return false; }
    c.textBaseline = "middle";
    c.font = `18px ${EMOJI_FONT}`;
    c.fillText("\u{1F7EA}", 3, 12); // 🟪 紫色大方块，正常人眼可见级别的大 emoji
    const d = c.getImageData(0, 0, 24, 24).data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 24) continue;                       // 全透明
      const max = Math.max(d[i], d[i + 1], d[i + 2]);
      const min = Math.min(d[i], d[i + 1], d[i + 2]);
      if (max - min > 40) { _emojiOk = true; return true; } // 存在彩色像素
    }
    _emojiOk = false;
  } catch {
    _emojiOk = false;
  }
  return _emojiOk;
}

/** 测试用：强制重置探测缓存 */
function resetEmojiDetection() { _emojiOk = null; }

/**
 * 极简 ZIP 打包器（store 模式，无压缩）
 * ------------------------------------------------------------------
 * PNG 本身已经压缩过，二次 deflate 收益极小；与其引入依赖，
 * 不如实现一百来行就把逐帧序列打包成 zip 给后期软件用。
 * 文件名限定 ASCII，避免 UTF-8 flag 带来的兼容问题。
 */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xffffffff;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

/** DOS 时间戳 */
function dosTime(date = new Date()) {
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | (Math.floor(date.getSeconds() / 2));
  const day = (((date.getFullYear() - 1980) & 0x7f) << 9) |
    (((date.getMonth() + 1) & 0x0f) << 5) | (date.getDate() & 0x1f);
  return { time, day };
}

class ZipWriter {
  constructor() {
    this.files = [];
    this._offset = 0;
  }

  /**
   * @param {string} name 文件名（ASCII）
   * @param {Uint8Array} data 原始字节
   */
  add(name, data) {
    const { time, day } = dosTime();
    const crc = crc32(data);
    const nameBytes = new TextEncoder().encode(name);

    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);            // version needed
    dv.setUint16(6, 0, true);             // flags
    dv.setUint16(8, 0, true);             // method = store
    dv.setUint16(10, time, true);
    dv.setUint16(12, day, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    this.files.push({
      name: nameBytes,
      crc,
      size: data.length,
      offset: this._offset,
      time,
      day,
      localHeader: local,
      data,
    });
    this._offset += local.length + data.length;
    return this;
  }

  /** 生成完整 zip 字节 */
  build() {
    const central = [];
    let cdSize = 0;
    for (const f of this.files) {
      const h = new Uint8Array(46 + f.name.length);
      const dv = new DataView(h.buffer);
      dv.setUint32(0, 0x02014b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 20, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true);
      dv.setUint16(12, f.time, true);
      dv.setUint16(14, f.day, true);
      dv.setUint32(16, f.crc, true);
      dv.setUint32(20, f.size, true);
      dv.setUint32(24, f.size, true);
      dv.setUint16(28, f.name.length, true);
      dv.setUint16(30, 0, true);
      dv.setUint16(32, 0, true);
      dv.setUint16(34, 0, true);
      dv.setUint16(36, 0, true);
      dv.setUint32(38, 0, true);
      dv.setUint32(42, f.offset, true);
      h.set(f.name, 46);
      central.push(h);
      cdSize += h.length;
    }

    const eocd = new Uint8Array(22);
    const dv = new DataView(eocd.buffer);
    dv.setUint32(0, 0x06054b50, true);
    dv.setUint16(4, 0, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, this.files.length, true);
    dv.setUint16(10, this.files.length, true);
    dv.setUint32(12, cdSize, true);
    dv.setUint32(16, this._offset, true);
    dv.setUint16(20, 0, true);

    const parts = [];
    for (const f of this.files) parts.push(f.localHeader, f.data);
    parts.push(...central, eocd);

    const total = parts.reduce((s, p) => s + p.length, 0);
    const out = new Uint8Array(total);
    let at = 0;
    for (const p of parts) { out.set(p, at); at += p.length; }
    return out;
  }
}

/**
 * Bar Chart Race 核心引擎
 * ==================================================================
 * 算法来源：Observable @d3/bar-chart-race（Mike Bostock，ISC License）
 * 本实现保留其数学本质，并做了三处工程化升级：
 *
 *  1) 连续时间采样（continuous sampling）
 *     D3 原版依赖 d3-transition 逐帧推进，只能顺序播放；这里把动画建模为
 *     纯函数 f(frameIndex, u) → 状态。于是可以任意 seek、变速、倒放，
 *     且每帧结果完全确定——录视频时不会因掉帧产生时长漂移。
 *
 *  2) 名次与显示条目数 n 解耦
 *     原版关键帧里写死 rank = min(n, i)，改一次 n 就要重建全部帧。
 *     这里每帧只存「全局降序名次 + 数值」，rank = min(n, globalRank) 在采样
 *     时现场算，拖动 n 的滑杆可实时响应，无需重算。
 *
 *  3) 候选集剪枝（candidate pruning）
 *     真正挤进榜首区的名字远少于全体。预先求「所有观测点的 top-(n+guard)
 *     并集」作为候选，后续排序只在这批候选上做，把 O(N log N) 压到与显示
 *     条目数同阶——这是它能扛住上万行数据的原因。
 *
 * ------------------------------------------------------------------
 * 术语
 *   观测 observation : 原始数据里的一个时间点，共 T 个
 *   关键帧 frame    : 相邻观测之间线性插值出 k 帧，总数 (T-1)·k + 1
 */



/**
 * 部分选择：把「最靠前的 k 个」移到数组头部。
 * desc 时是最小的反面（最大的 k 个），asc 时是最小的 k 个。
 * 平均 O(N)，避免了对全体的 O(N log N) 排序。
 */
function selectTopK(idx, vals, k, asc = false) {
  let lo = 0;
  let hi = idx.length - 1;
  const target = Math.min(k, hi);
  while (lo < hi) {
    const pivot = vals[idx[(lo + hi) >> 1]];
    let i = lo;
    let j = hi;
    while (i <= j) {
      if (asc) {
        while (vals[idx[i]] < pivot) i++;
        while (vals[idx[j]] > pivot) j--;
      } else {
        while (vals[idx[i]] > pivot) i++;
        while (vals[idx[j]] < pivot) j--;
      }
      if (i <= j) {
        const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
        i++; j--;
      }
    }
    if (target <= j) hi = j;
    else if (target >= i) lo = i;
    else break;
  }
  return idx;
}

/**
 * 按 direction 生成比较器。
 * 值相等时以「名字首次出现顺序」兜底 —— 这样每一帧的排列都是确定的，
 * 同一份数据多次跑出来的画面逐像素一致（对录像导出而言是硬要求）。
 * Array.prototype.sort 在 V8 里虽然稳定，但输入顺序依赖 Set/Map 的插入
 * 次序，显式 tie-break 才能杜绝不确定性。
 */
function comparator(vals, asc) {
  const primary = asc ? (a, b) => vals[a] - vals[b] : (a, b) => vals[b] - vals[a];
  return (a, b) => {
    const d = primary(a, b);
    return d !== 0 && !Number.isNaN(d) ? d : a - b;
  };
}

class RaceModel {
  /**
   * @param {Array<{date:Date,name:string,value:number,category?:string,image?:string}>} records
   * @param {object} [opts]
   * @param {number} [opts.k=10]        相邻观测之间插入多少帧
   * @param {number} [opts.guard=16]    候选集裕度（防插值帧冒出榜外黑马）
   * @param {boolean} [opts.prune=true] 是否启用候选集剪枝
   * @param {"desc"|"asc"} [opts.order] 降序比大 / 升序比小
   */
  constructor(records, opts = {}) {
    this.k = Math.max(1, opts.k ?? 10);
    this.guard = opts.guard ?? 16;
    this.prune = opts.prune !== false;
    this.direction = opts.order === "asc" ? "asc" : "desc";

    this._cache = new Map();     // frameIndex → {date, vals}
    this._rankCache = new Map(); // `${i}|${n}` → {rank, topN, top}
    this._candCache = new Map(); // n → Int32Array

    this._build(records);
  }

  // ------------------------------------------------------------- 构建阶段

  _build(records) {
    const meta = new Map();   // name → { index, category, image }
    const byDate = new Map(); // timestamp → Map<name, value>

    for (const r of records) {
      const name = String(r.name);
      let m = meta.get(name);
      if (!m) {
        m = { index: meta.size, category: null, image: null };
        meta.set(name, m);
      }
      if (r.category != null && r.category !== "" && !m.category) m.category = String(r.category);
      if (r.image && !m.image) m.image = String(r.image);

      const t = r.date instanceof Date ? r.date.getTime() : Number(r.date);
      if (!Number.isFinite(t)) continue;
      let row = byDate.get(t);
      if (!row) { row = new Map(); byDate.set(t, row); }
      const v = Number(r.value);
      if (!Number.isFinite(v)) continue;
      // 同一 (date,name) 重复出现时保留较大值，避免脏数据互相打架
      const prev = row.get(name);
      row.set(name, prev == null ? v : Math.max(prev, v));
    }

    this.names = [];
    this.categories = [];
    this.images = [];
    for (const [name, m] of meta) {
      m.index = this.names.length;
      this.names.push(name);
      this.categories.push(m.category);
      this.images.push(m.image);
    }
    this.N = this.names.length;

    const times = Array.from(byDate.keys()).sort((a, b) => a - b);
    this.dates = times;
    this.T = times.length;

    // 数值矩阵：observations[time][nameIndex]
    this.observations = times.map((t) => {
      const row = byDate.get(t);
      const arr = new Float64Array(this.N);
      for (const [name, v] of row) {
        const m = meta.get(name);
        if (m) arr[m.index] = v;
      }
      return arr;
    });

    this.frameCount = this.T > 0 ? (this.T - 1) * this.k + 1 : 0;
    if (this.T === 0) throw new Error("有效观测点数量为 0");
  }

  // ------------------------------------------------------------- 候选集

  /**
   * 候选集合：所有观测点的 top-(n+guard) 取并集。
   * 名字只要在任一时刻挤进过榜单边缘，就会被长期纳入候选。
   * 用快速选择代替全排序，把单次代价压到 O(N)。
   */
  candidates(n) {
    const hit = this._candCache.get(n);
    if (hit) return hit;
    const take = Math.min(this.N, n + this.guard);
    const set = new Set();
    const buf = new Int32Array(this.N);
    const asc = this.direction === "asc";
    for (const vals of this.observations) {
      for (let i = 0; i < this.N; i++) buf[i] = i;
      // 注意方向：升序模式下要收的是「最小的那些」，而非最大的
      selectTopK(buf, vals, take - 1, asc);
      for (let i = 0; i < take; i++) set.add(buf[i]);
    }
    const arr = Int32Array.from(set);
    this._candCache.set(n, arr);
    return arr;
  }

  // ------------------------------------------------------------- 帧求值

  /**
   * 第 i 帧的数值快照（只做插值，不做排序）。
   * @returns {{date:number, vals:Float64Array}}
   */
  frame(i) {
    const key = clamp(Math.round(i), 0, this.frameCount - 1);
    const cached = this._cache.get(key);
    if (cached) return cached;

    let vals;
    let date;
    if (key <= 0) {
      vals = this.observations[0];
      date = this.dates[0];
    } else if (key >= this.frameCount - 1) {
      vals = this.observations[this.T - 1];
      date = this.dates[this.T - 1];
    } else {
      const oi = Math.min(Math.floor(key / this.k), this.T - 2);
      const u = (key - oi * this.k) / this.k;
      const a = this.observations[oi];
      const b = this.observations[oi + 1];
      vals = new Float64Array(this.N);
      for (let j = 0; j < this.N; j++) vals[j] = a[j] + (b[j] - a[j]) * u;
      date = lerp(this.dates[oi], this.dates[oi + 1], u);
    }

    const snap = { date, vals };
    this._cache.set(key, snap);
    if (this._cache.size > 800) {
      const keys = Array.from(this._cache.keys()).slice(0, 300);
      for (const kk of keys) this._cache.delete(kk);
    }
    return snap;
  }

  /**
   * 某帧在给定 n 下的名次表。
   * @returns {{rank:Map<number,number>, topN:Int32Array, top:number}}
   */
  ranks(i, n) {
    const key = `${clamp(Math.round(i), 0, this.frameCount - 1)}|${n}`;
    const hit = this._rankCache.get(key);
    if (hit) return hit;

    const snap = this.frame(i === Infinity ? this.frameCount - 1 : i);
    const limit = n + this.guard;

    const asc = this.direction === "asc";
    let idx;
    if (this.prune) {
      idx = Int32Array.from(this.candidates(n));
      if (idx.length > limit) {
        selectTopK(idx, snap.vals, limit - 1, asc);
        const head = Array.from(idx.subarray(0, limit));
        head.sort(comparator(snap.vals, asc));
        idx = Int32Array.from(head);
      } else {
        Array.prototype.sort.call(idx, comparator(snap.vals, asc));
      }
    } else {
      idx = new Int32Array(this.N);
      for (let j = 0; j < this.N; j++) idx[j] = j;
      Array.prototype.sort.call(idx, comparator(snap.vals, asc));
    }

    const rank = new Map();
    const m = Math.min(idx.length, limit);
    for (let j = 0; j < m; j++) rank.set(idx[j], Math.min(n, j));
    const topN = Int32Array.from(idx.subarray(0, Math.min(n, idx.length)));
    const top = idx.length ? snap.vals[idx[0]] : 0;

    const res = { rank, topN, top };
    this._rankCache.set(key, res);
    if (this._rankCache.size > 800) {
      const keys = Array.from(this._rankCache.keys()).slice(0, 300);
      for (const kk of keys) this._rankCache.delete(kk);
    }
    return res;
  }

  // ------------------------------------------------------------- 采样

  /**
   * 核心：把「第 fi 帧 + 帧内进度 u」翻译成一帧完整画面状态。
   *
   * 统一处理 D3 原版里 enter / update / exit 三种情形：
   *   · update —— 起止都在榜内
   *   · enter  —— 起点取自上一帧的全局名次（≥ n，位于榜单下沿），从边缘滑入
   *   · exit   —— 终点取自下一帧的全局名次（≥ n），滑向边缘后消失
   * 三者共用同一条 rank = min(n, globalRank) 公式，因此只有一条代码路径。
   *
   * @param {number} fi 整数关键帧索引
   * @param {number} u  帧内进度 [0,1]
   * @param {number} n  显示条目数
   */
  sample(fi, u, n) {
    const i0 = clamp(Math.floor(fi), 0, this.frameCount - 1);
    const i1 = Math.min(i0 + 1, this.frameCount - 1);
    const A = this.frame(i0);
    const B = this.frame(i1);
    const RA = this.ranks(i0, n);
    const RB = this.ranks(i1, n);

    // 参与绘制 = 本帧榜内 ∪ 下一帧榜内（正是 enter/exit 需要额外考虑的两类）
    const union = new Set(RA.topN);
    for (const id of RB.topN) union.add(id);

    const bars = [];
    let totalValue = 0;
    for (const id of union) {
      const rA = RA.rank.has(id) ? RA.rank.get(id) : n;
      const rB = RB.rank.has(id) ? RB.rank.get(id) : n;
      const vA = A.vals[id] || 0;
      const vB = B.vals[id] || 0;
      const rank = lerp(rA, rB, u);
      const value = lerp(vA, vB, u);
      if (value > 0) totalValue += value;

      bars.push({
        id,
        name: this.names[id],
        category: this.categories[id],
        image: this.images[id],
        rank,
        value,
        entering: !RA.topN.includes(id),
      });
    }

    // 坐标轴域 = 榜首值，两帧之间插值 ⇒ 轴的推移同样平滑
    const xMax = Math.max(1e-9, lerp(RA.top, RB.top, u));

    // 按名次升序输出：bars[0] 恒为榜首，绘制顺序也天然从前景到背景
    bars.sort((a, b) => a.rank - b.rank);

    return {
      date: lerp(A.date, B.date, u),
      frameIndex: i0,
      xMax,
      bars,
      totalValue,
    };
  }

  /** 某一帧所有可见条目的合计值，用于「总计」角标 */
  totalAt(fi, u, n) {
    return this.sample(fi, u, n).totalValue;
  }

  get dateRange() {
    return [new Date(this.dates[0]), new Date(this.dates[this.T - 1])];
  }

  get hasCategory() {
    return this.categories.some((c) => c != null && c !== "");
  }

  /** 全时空范围内的最大绝对值，用于兜底轴域估算 */
  get globalMax() {
    let m = 0;
    for (const row of this.observations) {
      for (let i = 0; i < row.length; i++) if (row[i] > m) m = row[i];
    }
    return m || 1;
  }

  get categoriesUnique() {
    const s = new Set();
    for (const c of this.categories) if (c) s.add(c);
    return Array.from(s).sort();
  }
}

  valueFormat: (v) => Math.round(v).toLocaleString("en-US"),

  theme: {
    background: "#ffffff",
    text: "#1f2933",
    subtext: "#6b7280",
    axis: "#9aa5b1",
    grid: "rgba(0,0,0,0.08)",
    ticker: "rgba(31,41,51,0.22)",
    tickerSize: 1.5,     // 相对行高
  },

  colorScale: null,
  fadeEdge: true,        // 榜单边缘的条形淡入淡出
};

class RaceRenderer {
  constructor(canvas, options = {}) {
    this.canvas = canvas;
    this.ctx = canvas?.getContext("2d");
    this.options = { ...DEFAULT_OPTIONS, ...options };
    this.options.theme = { ...DEFAULT_OPTIONS.theme, ...(options.theme || {}) };
    this._textCache = new Map();
    this._layout = null;
    this.resize(this.options.width, this.options.height, this.options.dpr);
  }

  set(opts) {
    this.options = { ...this.options, ...opts };
    if (opts.theme) this.options.theme = { ...this.options.theme, ...opts.theme };
    // 换数据集后同名 id 会指向另一个条目，图标缓存必须作废
    this._iconCache = null;
    if (opts.width || opts.height || opts.dpr) {
      this.resize(this.options.width, this.options.height, this.options.dpr);
    } else {
      this._layout = null;
    }
  }

  resize(width, height, dpr = 1) {
    this.options.width = width;
    this.options.height = height;
    this.options.dpr = dpr;
    if (this.canvas) {
      this.canvas.width = Math.round(width * dpr);
      this.canvas.height = Math.round(height * dpr);
      this.canvas.style.width = width + "px";
      this.canvas.style.height = height + "px";
    }
    this._layout = null;
    this._textCache.clear();
  }

  // ------------------------------------------------------------- 布局

  /** 依据当前宽度/行数计算一套静态布局；结果可缓存，只在参数变化时重算 */
  layout() {
    if (this._layout) return this._layout;
    const o = this.options;
    const th = o.theme;
    const W = o.width;
    const H = o.height;
    const pad = { top: H * 0.045, right: W * 0.03, bottom: H * 0.035, left: W * 0.03 };

    let top = pad.top;
    const titleSize = o.title ? o.titleSize : 0;
    const subtitleSize = o.subtitle ? o.subtitleSize : 0;
    if (o.title) top += titleSize * 1.25;
    if (o.subtitle) top += subtitleSize * 1.45;
    if (o.title || o.subtitle) top += H * 0.018;

    // 顶部坐标轴
    const axisLabelSize = Math.max(11, Math.min(18, H * 0.022));
    const axisHeight = o.showAxis ? axisLabelSize * 1.6 + 8 : 0;
    const plotTop = top + axisHeight;

    const n = Math.max(1, o.n);

    // 底部：footer 预留空间。
    // 日期角标不外扩空间 —— 它叠印在绘图区内部右下（Flourish 的做法），
    // 画在柱子下层，被柱子自然遮挡，既醒目又不与任何元素抢地盘。
    const footerPad = o.footer ? H * 0.05 : 0;
    const plotBottom = H - pad.bottom - footerPad;
    const plotHeight = Math.max(10, plotBottom - plotTop);

    const yStep = plotHeight / (n + o.plotPad);
    // 3D 的厚度从行高里扣，挤出方向朝下，因此永远不会压到下一行
    const depth = o.depth3D > 0 ? Math.max(1, yStep * 0.2 * o.depth3D) : 0;
    const barHeight = Math.max(2, yStep * (1 - o.barPadding) - depth);

    // 柱头徽标
    const iconSize = clamp(barHeight * o.iconSize, 9, Math.max(12, yStep * 0.95));
    const showIcon = o.showImages && o.iconPosition !== "none";
    // 徽标贴在柱头外侧时要给它留地方，否则最长的条形会把徽标顶出画布
    const iconReserve = showIcon && o.iconPosition === "front" ? iconSize * 0.8 + 6 : 0;

    // 左侧名字列
    const labelColumn = o.labelLayout === "left" ? W * 0.22 : 0;
    // 右侧数值列宽度（按最长数字估的保守值）
    const valueColumn = o.showValue ? Math.min(W * 0.2, Math.max(70, axisLabelSize * 5.5)) : 0;

    const plotLeft = pad.left + labelColumn;
    const plotRight = W - pad.right - valueColumn - iconReserve;
    const plotWidth = Math.max(20, plotRight - plotLeft);

    this._layout = {
      W, H, pad, plotTop, plotBottom, plotHeight, plotLeft, plotRight, plotWidth,
      yStep, barHeight, depth, iconSize, showIcon, axisLabelSize, titleSize, subtitleSize,
      labelColumn, valueColumn, n,
      tickerSize: Math.max(24, barHeight * th.tickerSize),
      labelSize: clamp(barHeight * 0.42, 11, Math.max(14, barHeight * 0.62)),
    };
    return this._layout;
  }

  // ------------------------------------------------------------- 绘制主流程

  /**
   * 绘制一帧
   * @param {{date:number,xMax:number,bars:Array,totalValue:number}} sample
   */
  draw(sample) {
    const ctx = this.ctx;
    if (!ctx) return;
    const o = this.options;
    const L = this.layout();
    const th = o.theme;

    ctx.save();
    ctx.setTransform(o.dpr, 0, 0, o.dpr, 0, 0);
    ctx.clearRect(0, 0, L.W, L.H);

    this._drawBackground(ctx, L);

    const x0 = L.plotLeft;
    const scaleX = (v) => x0 + clamp(v / sample.xMax, 0, 1.2) * L.plotWidth;
    const yOf = (rank) => L.plotTop + rank * L.yStep;

    // —— 轴：画在条形之下，作为背景参照 ——
    const tickValues = o.showAxis || o.showGrid ? ticks(sample.xMax, o.tickCount) : [];
    if (o.showGrid) this._drawGrid(ctx, L, scaleX, tickValues);
    if (o.showAxis) this._drawAxis(ctx, L, scaleX, tickValues);

    if (o.showTicker) this._drawTicker(ctx, L, sample);

    // —— 条形：裁剪到绘图区，让滑出榜单的条形自然消失 ——
    ctx.save();
    ctx.beginPath();
    ctx.rect(L.plotLeft - 2, L.plotTop - 2, L.plotWidth + L.valueColumn + 4, L.plotHeight + 4);
    ctx.clip();

    // 先画 rank 大的，让靠前的条形压在上面
    const bars = sample.bars;
    for (let i = bars.length - 1; i >= 0; i--) {
      const bar = bars[i];
      const alpha = o.fadeEdge ? this._edgeAlpha(bar.rank, L.n) : 1;
      if (alpha <= 0.003) continue;
      this._drawBar(ctx, L, bar, scaleX, yOf, alpha);
    }
    ctx.restore();

    // 徽标画在裁剪区之外 —— "起点外侧"位置本来就在绘图区左边缘外，
    // 放进裁剪区会被整个切掉（这就是之前 start 模式图标消失的原因）。
    // front / inside 位置都在区内，不受影响。
    if (L.showIcon) {
      for (let i = bars.length - 1; i >= 0; i--) {
        const bar = bars[i];
        const alpha = o.fadeEdge ? this._edgeAlpha(bar.rank, L.n) : 1;
        if (alpha <= 0.003) continue;
        this._drawIcon(ctx, L, bar, scaleX, yOf, alpha);
      }
    }

    // 标签绘制在裁剪区外会更好看（允许名字溢出到左侧列）
    for (const bar of bars) {
      const alpha = o.fadeEdge ? this._edgeAlpha(bar.rank, L.n) : 1;
      if (alpha <= 0.003) continue;
      this._drawLabels(ctx, L, bar, scaleX, yOf, alpha);
    }

    if (o.title) this._drawTitle(ctx, L);
    if (o.footer) this._drawFooter(ctx, L);
    ctx.restore();
  }

  /** 榜单下沿之外逐渐隐去，避免“第 n+1 名”堆在边缘形成色块 */
  _edgeAlpha(rank, n) {
    return clamp(1 - (rank - (n - 0.85)), 0, 1);
  }

  // ------------------------------------------------------------- 各图层

  _drawBackground(ctx, L) {
    const th = this.options.theme;
    const bg = th.background;
    if (Array.isArray(bg)) {
      const g = ctx.createLinearGradient(0, 0, 0, L.H);
      bg.forEach((s, i) => g.addColorStop(i / (bg.length - 1), s));
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = bg;
    }
    ctx.fillRect(0, 0, L.W, L.H);

    // 科技风点阵底纹：用 pattern 缓存，避免每帧上千次 fillRect
    if (th.dot) {
      const gap = Math.max(16, Math.round(L.H / 46));
      const pat = this._dotPattern(ctx, th.dot, gap);
      if (pat) {
        ctx.save();
        ctx.fillStyle = pat;
        ctx.fillRect(0, 0, L.W, L.H);
        ctx.restore();
      }
    }
  }

  /** 生成点阵 pattern（按 间距+颜色 缓存，尺寸变化时重建） */
  _dotPattern(ctx, color, gap) {
    if (this._dot?.gap === gap && this._dot?.color === color) return this._dot.pattern;
    const size = gap;
    const tile = document.createElement("canvas");
    tile.width = tile.height = size;
    const c = tile.getContext("2d");
    if (!c) return null;
    c.fillStyle = color;
    c.fillRect(0, 0, 1.5, 1.5);
    this._dot = { gap, color, pattern: ctx.createPattern(tile, "repeat") };
    return this._dot.pattern;
  }

  _drawGrid(ctx, L, scaleX, tickValues) {
    const th = this.options.theme;
    ctx.save();
    ctx.strokeStyle = th.grid;
    ctx.lineWidth = 1;
    for (const t of tickValues) {
      const x = Math.round(scaleX(t)) + 0.5;
      if (x < L.plotLeft || x > L.plotRight) continue;
      ctx.beginPath();
      ctx.moveTo(x, L.plotTop - 6);
      ctx.lineTo(x, L.plotBottom);
      ctx.stroke();
    }
    // 科技风：绘图区顶部一条强调色基线，把所有竖线"钉"住，画面立刻有结构
    if (th.accent) {
      ctx.strokeStyle = hexToRgba(th.accent, 0.5);
      ctx.lineWidth = 1.5;
      if (th.glow) { ctx.shadowColor = hexToRgba(th.accent, 0.6); ctx.shadowBlur = 8; }
      ctx.beginPath();
      ctx.moveTo(L.plotLeft, L.plotTop - 0.5);
      ctx.lineTo(L.plotRight, L.plotTop - 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  _drawAxis(ctx, L, scaleX, tickValues) {
    const th = this.options.theme;
    ctx.save();
    ctx.font = `500 ${L.axisLabelSize}px ${th.mono ? MONO_FONT : FONT_STACK}`;
    ctx.fillStyle = th.axis;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    for (const t of tickValues) {
      const x = scaleX(t);
      if (x < L.plotLeft - 2 || x > L.plotRight + L.valueColumn) continue;
      ctx.fillText(this.options.valueFormat(t), x, L.plotTop - 10);
    }
    ctx.restore();
  }

  /**
   * 柱体。depth3D > 0 时走伪 3D 画法：
   * 厚度层（下移 depth 的暗色）+ 正面竖向渐变 + 顶部高光 + 底部暗边，
   * 四层叠加出"上表面受光、向下挤出"的体积感，比真 3D 便宜得多，
   * 而且完全在 Canvas 2D 里完成，录视频时零额外成本。
   */
  _drawBar(ctx, L, bar, scaleX, yOf, alpha) {
    const o = this.options;
    const y = yOf(bar.rank);
    const h = L.barHeight;
    const w = Math.max(0, scaleX(bar.value) - L.plotLeft);
    if (w < 0.5) return;
    const color = o.colorScale.colorOf(bar, Math.round(bar.rank));
    const r = Math.min(h / 2, w, h * o.barRadius);
    const d = L.depth;
    const x0 = L.plotLeft;

    const path = () => {
      ctx.beginPath();
      roundRectPath(ctx, x0, y, w, h, [0, r, r, 0]);
    };

    ctx.save();
    ctx.globalAlpha = alpha * o.barOpacity;

    // ① 挤出厚度：同形状向下偏移 d，用压暗的同色，视觉上就是柱体的"下沿"
    if (d > 0.4) {
      ctx.beginPath();
      roundRectPath(ctx, x0, y + d, w, h, [0, r, r, 0]);
      ctx.fillStyle = shade(color, -0.45);
      ctx.fill();
    }

    // ② 正面：顶亮底暗的竖向渐变（无 3D 时就是纯色，零开销）
    path();
    const glow = o.theme.glow || 0;
    if (glow > 0) {
      ctx.shadowColor = hexToRgba(color, 0.55 * glow);
      ctx.shadowBlur = Math.max(6, h * 0.6) * glow;
    }
    if (d > 0.4) {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, shade(color, 0.32));
      g.addColorStop(0.5, shade(color, 0.04));
      g.addColorStop(1, shade(color, -0.22));
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = color;
    }
    ctx.fill();
    // 发光只作用于柱体本身，后面的高光/暗边不能被糊掉
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;

    if (d > 0.4 && h > 3) {
      // ③ 顶部高光：模拟上表面反光，是立体感最关键的一笔
      ctx.save();
      path();
      ctx.clip();
      const hl = ctx.createLinearGradient(0, y, 0, y + h * 0.55);
      hl.addColorStop(0, "rgba(255,255,255,0.36)");
      hl.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = hl;
      ctx.fillRect(x0, y, w, h * 0.55);
      ctx.restore();

      // ④ 底部暗边：把正面与厚度层的交界压实
      ctx.save();
      path();
      ctx.clip();
      ctx.fillStyle = hexToRgba(shade(color, -0.55), 0.45);
      ctx.fillRect(x0, y + h - Math.max(1, h * 0.08), w, Math.max(1, h * 0.08));
      ctx.restore();
    }

    ctx.restore();
  }

  /**
   * 柱头徽标（图标）。
   * 三种形态：URL 图片 → 圆形裁切；emoji → 白色圆托；都没有 → 首字圆牌。
   * 位置默认骑在柱头上（条形末端），随柱子一起移动。
   */
  _drawIcon(ctx, L, bar, scaleX, yOf, alpha) {
    const o = this.options;
    const icon = this._iconOf(bar);
    // 值为 0 的条目不画柱子，也不该凭空挂一个圆牌
    if (!icon || !(bar.value > 0)) return;

    const h = L.barHeight;
    const size = L.iconSize;
    const r = size / 2;
    const y = yOf(bar.rank);
    const cy = y + h / 2;
    const barEnd = scaleX(bar.value);
    const color = o.colorScale.colorOf(bar, Math.round(bar.rank));
    const TAU = Math.PI * 2;

    let cx;
    if (o.iconPosition === "start") {
      cx = L.plotLeft - r - 6;                                   // 条形起点外侧
    } else if (o.iconPosition === "inside") {
      cx = Math.max(L.plotLeft + r + 6, barEnd - r - 8);         // 柱头内侧
    } else {
      cx = barEnd + r + 8;                                       // 柱头外侧（默认）
    }

    const disc = (fill) => {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.fillStyle = fill;
      ctx.fill();
    };

    ctx.save();
    ctx.globalAlpha = alpha;

    if (icon.kind === "url") {
      const img = o.images?.get(bar.name) || o.images?.get(icon.value);
      if (!img || !img.complete || !img.naturalWidth) { ctx.restore(); return; }
      disc("#ffffff");
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.clip();
      drawCover(ctx, img, cx - r, cy - r, size, size);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.lineWidth = Math.max(1, size * 0.05);
      ctx.strokeStyle = "rgba(0,0,0,0.16)";
      ctx.stroke();
    } else if (icon.kind === "emoji" && this._emojiOk()) {
      disc("rgba(255,255,255,0.94)");
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.lineWidth = Math.max(1, size * 0.06);
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.stroke();
      ctx.font = `${size * 0.62}px ${EMOJI_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#1f2933";
      ctx.fillText(icon.value, cx, cy + size * 0.03);
    } else {
      // 首字圆牌：系统没有 emoji 字体、或压根没匹配到图标时的兜底
      disc(shade(color, -0.08));
      ctx.font = `700 ${size * 0.54}px ${FONT_STACK}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = contrastText(shade(color, -0.08), "#1f2933", "#ffffff");
      ctx.fillText(initial(bar.name), cx, cy + size * 0.03);
    }

    ctx.restore();
  }

  /** 图标解析结果缓存：每个名字只算一次 */
  _iconOf(bar) {
    const o = this.options;
    if (!o.showImages || o.iconPosition === "none") return null;
    if (!this._iconCache) this._iconCache = new Map();
    const key = bar.id != null ? bar.id : bar.name;
    let v = this._iconCache.get(key);
    if (v === undefined) {
      v = iconFor(bar.name, bar.category, bar.image);
      this._iconCache.set(key, v);
    }
    return v;
  }

  /** emoji 字体探测结果缓存（每次绘制都测太贵） */
  _emojiOk() {
    if (this._emojiSupport == null) this._emojiSupport = detectEmojiSupport();
    return this._emojiSupport;
  }

  _drawLabels(ctx, L, bar, scaleX, yOf, alpha) {
    const o = this.options;
    const th = o.theme;
    const y = yOf(bar.rank);
    const h = L.barHeight;
    const cy = y + h / 2;
    const barEnd = scaleX(bar.value);
    const color = o.colorScale.colorOf(bar, Math.round(bar.rank));
    const size = L.labelSize;
    const valueStr = o.showValue && bar.value >= 0.5 ? this.options.valueFormat(bar.value) : "";

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textBaseline = "middle";

    // 预量三种宽度，决定标签的归宿
    ctx.font = `600 ${size}px ${FONT_STACK}`;
    const nameW = this._measure(ctx, bar.name, size);
    ctx.font = `500 ${size * 0.94}px ${FONT_STACK}`;
    const valW = valueStr ? this._measure(ctx, valueStr, size * 0.94) : 0;
    const pairW = nameW + (valueStr ? 12 + valW : 0);
    const rightEdge = L.W - L.pad.right;
    // 徽标骑在柱头时，标签要往右让出一个徽标的身位，否则会叠在图标上
    const iconGap = L.showIcon && o.iconPosition === "front" ? L.iconSize + 12 : 0;

    const drawName = (x, align, fill) => {
      ctx.font = `600 ${size}px ${FONT_STACK}`;
      ctx.textAlign = align;
      ctx.fillStyle = fill;
      // 右对齐时可用宽度 = 从画布左留白到 x；之前用 x - plotLeft 会算出负数，
      // 把 left 布局下的名字全部省略成 "…"
      const maxW = align === "right" ? x - L.pad.left - 4 : rightEdge - x;
      ctx.fillText(this._ellipsis(ctx, bar.name, maxW, size), x, cy);
    };
    const drawValue = (x, align) => {
      if (!valueStr) return;
      ctx.font = `500 ${size * 0.94}px ${th.mono ? MONO_FONT : FONT_STACK}`;
      ctx.textAlign = align;
      ctx.fillStyle = th.subtext;
      ctx.fillText(valueStr, x, cy);
    };

    if (o.labelLayout === "left") {
      // 左侧固定列，右对齐紧贴条形起点；起点外侧有徽标时名字再让一个身位
      const nameX = L.plotLeft - 10 - (L.showIcon && o.iconPosition === "start" ? L.iconSize + 12 : 0);
      drawName(nameX, "right", th.text);
      drawValue(rightEdge, "right");
    } else if (o.labelLayout === "inline") {
      const innerSpace = barEnd - L.plotLeft - 14;
      if (innerSpace > nameW + 10) {
        // 条形够长：名字压在条形上，用对比色保证可读
        drawName(L.plotLeft + 10, "left", contrastText(color, th.text, "#ffffff"));
      } else {
        drawName(barEnd + 10 + iconGap, "left", th.text);
      }
      drawValue(rightEdge, "right");
    } else {
      // trail：名字与数值成组跟在条形末端；右缘放不下时整组收进条形内部
      const anchor = barEnd + 10 + iconGap;
      if (anchor + pairW <= rightEdge) {
        drawName(anchor, "left", th.text);
        if (valueStr) drawValue(anchor + nameW + 12, "left");
      } else if (barEnd - 10 - pairW >= L.plotLeft) {
        const fill = contrastText(color, th.text, "#ffffff");
        drawName(barEnd - 10, "right", fill);
        if (valueStr) {
          ctx.font = `500 ${size * 0.94}px ${th.mono ? MONO_FONT : FONT_STACK}`;
          ctx.textAlign = "right";
          ctx.fillStyle = fill;
          ctx.globalAlpha = alpha * 0.72;
          ctx.fillText(valueStr, barEnd - 10 - nameW - 12, cy);
          ctx.globalAlpha = alpha;
        }
      } else {
        // 条形太短：贴起点外侧
        drawName(L.plotLeft + 6, "left", th.text);
        if (valueStr) drawValue(L.plotLeft + 6 + nameW + 12, "left");
      }
    }

    ctx.restore();
  }

  _drawTicker(ctx, L, sample) {
    const th = this.options.theme;
    const str = this.options.dateFormat(sample.date);
    ctx.save();
    ctx.globalAlpha = 1;
    // 等宽数字：年份切换时宽度恒定，不会带着整块画面左右抖
    ctx.font = `700 ${L.tickerSize}px ${th.mono ? MONO_FONT : FONT_STACK}`;
    if (th.glow) {
      ctx.shadowColor = th.ticker;
      ctx.shadowBlur = L.tickerSize * 0.45 * th.glow;
    }
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = th.ticker;
    // 叠印在绘图区内部右下（右缘对齐柱区，避开数值列），柱子会自然遮住它
    ctx.fillText(str, L.plotRight - 6, L.plotBottom - L.yStep * 0.18);
    ctx.restore();
  }

  _drawTitle(ctx, L) {
    const o = this.options;
    const th = o.theme;
    let y = L.pad.top + o.titleSize * 0.9;
    ctx.save();
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    // 科技风：标题左侧一条渐隐的强调色竖条，压住整个标题块
    const tx = L.pad.left + (th.accent ? 18 : 0);
    if (th.accent) {
      const barTop = y - o.titleSize * 0.95;
      const barH = o.titleSize * 1.1 + (o.subtitle ? o.subtitleSize * 1.2 : 0);
      const g = ctx.createLinearGradient(0, barTop, 0, barTop + barH);
      g.addColorStop(0, th.accent);
      g.addColorStop(1, hexToRgba(th.accent, 0.12));
      ctx.fillStyle = g;
      ctx.fillRect(L.pad.left, barTop, 4, barH);
    }
    if (o.title) {
      ctx.font = `700 ${o.titleSize}px ${FONT_STACK}`;
      ctx.fillStyle = th.text;
      ctx.fillText(o.title, tx, y);
      y += o.titleSize * 0.35;
    }
    if (o.subtitle) {
      ctx.font = `400 ${o.subtitleSize}px ${FONT_STACK}`;
      ctx.fillStyle = th.subtext;
      ctx.fillText(o.subtitle, tx, y + o.subtitleSize * 0.9);
    }
    ctx.restore();
  }

  _drawFooter(ctx, L) {
    const o = this.options;
    ctx.save();
    ctx.font = `400 ${o.footerSize}px ${FONT_STACK}`;
    ctx.fillStyle = o.theme.subtext;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(o.footer, L.pad.left, L.H - L.pad.bottom * 0.6);
    ctx.restore();
  }

  // ------------------------------------------------------------- 文字工具

  /** 带缓存的文本宽度测量 */
  _measure(ctx, str, size) {
    const key = `${size}|${str}`;
    let w = this._textCache.get(key);
    if (w == null) {
      w = ctx.measureText(str).width;
      if (this._textCache.size > 4000) this._textCache.clear();
      this._textCache.set(key, w);
    }
    return w;
  }

  _ellipsis(ctx, str, maxWidth, size) {
    if (this._measure(ctx, str, size) <= maxWidth) return str;
    let lo = 0;
    let hi = str.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (this._measure(ctx, str.slice(0, mid) + "…", size) <= maxWidth) lo = mid;
      else hi = mid - 1;
    }
    return str.slice(0, lo) + "…";
  }

  /** 清掉的工具：外部想看当前可用绘图区 */
  get plotRect() {
    const L = this.layout();
    return { x: L.plotLeft, y: L.plotTop, w: L.plotWidth, h: L.plotHeight };
  }
}

/** 带逐角半径的圆角矩形路径（左上/右上/右下/左下） */
function roundRectPath(ctx, x, y, w, h, radii) {
  const [tl, tr, br, bl] = radii.map((r, i) =>
    Math.min(r, (i === 0 || i === 3 ? w : w) < 0 ? 0 : w, h));
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y);
  if (tr) ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br);
  if (br) ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h);
  if (bl) ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl);
  if (tl) ctx.arcTo(x, y, x + tl, y, tl);
}

/** contain 或 cover 地把图片画进方框；这里用 cover 并居中裁切 */
function drawCover(ctx, img, x, y, w, h) {
  const ir = img.naturalWidth / img.naturalHeight;
  const br = w / h;
  let sw = img.naturalWidth;
  let sh = img.naturalHeight;
  let sx = 0;
  let sy = 0;
  if (ir > br) { sw = img.naturalHeight * br; sx = (img.naturalWidth - sw) / 2; }
  else { sh = img.naturalWidth / br; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
